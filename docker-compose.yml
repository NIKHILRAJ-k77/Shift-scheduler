services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiftflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - shiftflow_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiftflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiftflow_pgdata:
